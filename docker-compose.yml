version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: revenueguard-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DOCS_ENABLED=false
      - DATABASE_URL=sqlite:////app/data/revenueguard.db
      - SECRET_KEY=replace-with-cryptographically-random-secret-key-32chars
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1
    volumes:
      - rg-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: revenueguard-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  rg-data:
    name: revenueguard-database-volume

